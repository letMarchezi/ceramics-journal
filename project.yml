name: CeramicsJournal
options:
  bundleIdPrefix: com.studio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  CeramicsJournal:
    type: application
    platform: iOS
    sources:
      - path: CeramicsJournal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studio.ceramicsjournal
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Ceramics Journal"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSCameraUsageDescription: "Ceramics Journal uses the camera to photograph your clay, glazes and finished pieces."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Ceramics Journal imports photos of materials and finished pieces from your photo library."
  CeramicsJournalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CeramicsJournalTests
    dependencies:
      - target: CeramicsJournal
